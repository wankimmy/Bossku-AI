# Production overlay — use with base compose:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Removes docker.sock and broad workspace mount; disables debug; hides DB/Redis ports.

services:
  backend:
    environment:
      APP_DEBUG: "false"
      BOSSKU_ALLOW_DOCKER_COMPOSE: "false"
      BOSSKU_WORKSPACE_WRITABLE: "false"
    volumes:
      - ./app:/var/www/html
      - ./:/repo

  postgres:
    ports: !reset []

  redis:
    ports: !reset []

  frontend:
    environment:
      NODE_ENV: production
      BOSSKU_WEB_DEV: "false"

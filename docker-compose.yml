# Host ports (override in repo-root .env): WEB 28470, API 28480, Postgres 28432, Redis 28379
# Internal service ports (postgres:5432, redis:6379) stay unchanged inside the network.

services:
  backend:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - ./app/.env
    environment:
      BOSSKU_REPO_PATH: /repo
      # Allow php-fpm to write bind-mounted sibling repos under /workspace (see docker/php/entrypoint.sh).
      BOSSKU_WORKSPACE_WRITABLE: ${BOSSKU_WORKSPACE_WRITABLE:-true}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: bossku
      DB_USERNAME: bossku
      DB_PASSWORD: bossku
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
    volumes:
      - ./app:/var/www/html
      - ./:/repo
      - ../:/workspace
      # Local dev only: run docker compose against sibling projects under /workspace
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [bossku]

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${BOSSKU_PORT_API:-28480}:80"
    volumes:
      - ./app:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks: [bossku]

  frontend:
    build:
      context: ./docker/node
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./web:/app
      - node_modules:/app/node_modules
    ports:
      - "${BOSSKU_PORT_WEB:-28470}:3000"
    environment:
      NUXT_PUBLIC_API_BASE: http://localhost:${BOSSKU_PORT_API:-28480}
      HOST: 0.0.0.0
      PORT: "3000"
      NODE_ENV: production
      # Set BOSSKU_WEB_DEV=true in repo-root .env for hot-reload (nuxt dev) instead of production build.
      BOSSKU_WEB_DEV: ${BOSSKU_WEB_DEV:-false}
    depends_on:
      - nginx
    networks: [bossku]
    # Production Nuxt (npm run build + node .output/server). Rebuild after UI edits — see README.
    command:
      - sh
      - -ec
      - |
        if [ ! -f node_modules/@nuxtjs/tailwindcss/package.json ]; then
          echo "[bossku-web] Installing dependencies (dev deps required for nuxt build)..."
          NPM_CONFIG_PRODUCTION=false npm ci 2>/dev/null || NPM_CONFIG_PRODUCTION=false npm install
        fi
        if [ "$${BOSSKU_WEB_DEV:-false}" = "true" ]; then
          echo "[bossku-web] Dev mode (nuxt dev) on http://0.0.0.0:$${PORT:-3000}"
          exec npm run dev -- --host 0.0.0.0 --port "$${PORT:-3000}"
        fi
        stamp=".output/server/index.mjs"
        needs_build=0
        if [ ! -f "$$stamp" ]; then
          needs_build=1
        else
          for path in pages components composables utils layouts middleware plugins assets app.vue nuxt.config.ts; do
            if [ -e "$$path" ] && find "$$path" -type f -newer "$$stamp" 2>/dev/null | head -1 | grep -q .; then
              needs_build=1
              break
            fi
          done
        fi
        if [ "$$needs_build" = "1" ]; then
          echo "[bossku-web] Building Nuxt (source changed or first start; may take a few minutes)..."
          NPM_CONFIG_PRODUCTION=false npm run build
        fi
        echo "[bossku-web] Serving production build on http://0.0.0.0:$${PORT:-3000}"
        exec node .output/server/index.mjs

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: bossku
      POSTGRES_USER: bossku
      POSTGRES_PASSWORD: bossku
    ports:
      - "${BOSSKU_PORT_POSTGRES:-28432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bossku -d bossku"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [bossku]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${BOSSKU_PORT_REDIS:-28379}:6379"
    networks: [bossku]

volumes:
  pgdata:
  node_modules:

networks:
  bossku:
    driver: bridge

# Host ports (override in repo-root .env): WEB 28470, API 28480, Postgres 28432, Redis 28379
# Internal service ports (postgres:5432, redis:6379) stay unchanged inside the network.

services:
  backend:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - ./app/.env
    environment:
      BOSSKU_REPO_PATH: /repo
      # Allow php-fpm to write bind-mounted sibling repos under /workspace (see docker/php/entrypoint.sh).
      BOSSKU_WORKSPACE_WRITABLE: ${BOSSKU_WORKSPACE_WRITABLE:-true}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: bossku
      DB_USERNAME: bossku
      DB_PASSWORD: bossku
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
    volumes:
      - ./app:/var/www/html
      - ./:/repo
      - ../:/workspace
      # Local dev only: run docker compose against sibling projects under /workspace
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [bossku]

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${BOSSKU_PORT_API:-28480}:80"
    volumes:
      - ./app:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks: [bossku]

  frontend:
    build:
      context: ./docker/node
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./web:/app
      - node_modules:/app/node_modules
      - ../:/workspace:ro
    ports:
      - "${BOSSKU_PORT_WEB:-28470}:3000"
    environment:
      # Empty = same-origin /api on the web port (Nitro proxies to nginx). Avoids browser CORS.
      NUXT_PUBLIC_API_BASE: ""
      NUXT_API_PROXY_TARGET: http://nginx/api/**
      HOST: 0.0.0.0
      PORT: "3000"
      NODE_ENV: production
      # Set BOSSKU_WEB_DEV=true in repo-root .env for hot-reload (nuxt dev) instead of production build.
      BOSSKU_WEB_DEV: ${BOSSKU_WEB_DEV:-false}
      # Pixel office: auto export → sync → build on startup (see docker/node/web-start.sh)
      ZEP_PIXEL_AGENTS_ROOT: ${ZEP_PIXEL_AGENTS_ROOT:-/workspace/zep-pixel-agents}
      BOSSKU_AUTO_PIXEL_OFFICE: ${BOSSKU_AUTO_PIXEL_OFFICE:-true}
      BOSSKU_PIXEL_OFFICE_SKIP_ASSETS: ${BOSSKU_PIXEL_OFFICE_SKIP_ASSETS:-0}
      BOSSKU_PIXEL_OFFICE_GRACEFUL: ${BOSSKU_PIXEL_OFFICE_GRACEFUL:-1}
      BOSSKU_PIXEL_OFFICE_STRICT: ${BOSSKU_PIXEL_OFFICE_STRICT:-0}
      BOSSKU_AUTO_FETCH_FURNITURE_BUNDLE: ${BOSSKU_AUTO_FETCH_FURNITURE_BUNDLE:-1}
      BOSSKU_ZEP_FURNITURE_CACHE: ${BOSSKU_ZEP_FURNITURE_CACHE:-1}
    depends_on:
      - nginx
    networks: [bossku]
    # Entry script lives in mounted web/scripts; sed strips CRLF if edited on Windows.
    command:
      - sh
      - -c
      - "sed 's/\\r$//' /app/scripts/docker-web-start.sh | sh"

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: bossku
      POSTGRES_USER: bossku
      POSTGRES_PASSWORD: bossku
    ports:
      - "${BOSSKU_PORT_POSTGRES:-28432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bossku -d bossku"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [bossku]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${BOSSKU_PORT_REDIS:-28379}:6379"
    networks: [bossku]

volumes:
  pgdata:
  node_modules:

networks:
  bossku:
    driver: bridge

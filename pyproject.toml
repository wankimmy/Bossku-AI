[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bossku"
version = "2.0.0"
description = "Lightweight AI co-founder toolkit for Cursor, Claude Code, Codex, and OpenCode"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "BosskuAI" }]
dependencies = []

[project.scripts]
bossku = "bossku.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["bossku*"]

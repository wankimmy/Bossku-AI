appId: ai.bossku.desktop
productName: BosskuAI
copyright: Copyright (c) BosskuAI

directories:
  output: dist
  buildResources: assets

# Auto-update feed. electron-updater reads the latest.yml + installer that
# `npm run release` (or the desktop-release CI workflow) publishes to GitHub
# Releases for the wankimmy/Bossku-AI repo. The installed app polls this feed
# and shows an update popup when a newer version is published.
publish:
  - provider: github
    owner: wankimmy
    repo: Bossku-AI
    # Publish a real (non-draft) release so electron-updater can see it. Default is
    # "draft", which the auto-updater ignores until manually published.
    releaseType: release

# App code that ships inside the asar.
files:
  - src/**/*
  - scripts/**/*
  - package.json

# The Dockerized stack is bundled as resources/stack and copied to the user-data
# dir at runtime (see src/stackSync.js). Heavy/rebuilt paths are filtered out.
extraResources:
  - from: scripts
    to: install
    filter:
      - install.ps1
  - from: ../app
    to: stack/app
    filter:
      - "**/*"
      - "!.env"
      - "!vendor/**"
      - "!node_modules/**"
      # Never ship a baked config/route/event cache — a Docker-built config.php pins
      # cache/session/queue to redis, which the native portable PHP can't load
      # ("Class Redis not found"). install.ps1 regenerates these on first run.
      - "!bootstrap/cache/*.php"
      - "!storage/logs/*.log"
      - "!storage/framework/cache/data/**"
      - "!storage/framework/sessions/**"
      - "!storage/framework/views/**"
  - from: ../web
    to: stack/web
    filter:
      - "**/*"
      - "!node_modules/**"
      - "!.nuxt/**"
      - "!.output/**"
      - "!pixel-office/node_modules/**"
      - "!pixel-office/.cache/**"
  - from: ../docker
    to: stack/docker
  - from: ../docker-compose.yml
    to: stack/docker-compose.yml

win:
  target:
    - nsis
  # To brand the app, drop a 256x256 icon at desktop/assets/icon.ico; electron-builder
  # auto-detects it (buildResources). Without it, the default Electron icon is used.

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: BosskuAI

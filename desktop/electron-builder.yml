appId: ai.bossku.desktop
productName: BosskuAI
copyright: Copyright (c) BosskuAI

directories:
  output: dist
  buildResources: assets

# App code that ships inside the asar.
files:
  - src/**/*
  - package.json

# The Dockerized stack is bundled as resources/stack and copied to the user-data
# dir at runtime (see src/stackSync.js). Heavy/rebuilt paths are filtered out.
extraResources:
  - from: ../app
    to: stack/app
    filter:
      - "**/*"
      - "!.env"
      - "!vendor/**"
      - "!node_modules/**"
      - "!storage/logs/*.log"
      - "!storage/framework/cache/data/**"
      - "!storage/framework/sessions/**"
      - "!storage/framework/views/**"
  - from: ../web
    to: stack/web
    filter:
      - "**/*"
      - "!node_modules/**"
      - "!.nuxt/**"
      - "!.output/**"
      - "!pixel-office/node_modules/**"
      - "!pixel-office/.cache/**"
  - from: ../docker
    to: stack/docker
  - from: ../docker-compose.yml
    to: stack/docker-compose.yml

win:
  target:
    - nsis
  # To brand the app, drop a 256x256 icon at desktop/assets/icon.ico; electron-builder
  # auto-detects it (buildResources). Without it, the default Electron icon is used.

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: BosskuAI

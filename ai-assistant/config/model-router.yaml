# BosskuAI model routing (reference — canonical list: `app/config/bossku_models.php`).
# Human-oriented names; map to your provider’s model IDs via env.

planning:
  role: frontier
  primary_model_hint: gpt-5.5
  backup_model_hints:
    - claude-opus-4.7
    - gemini-3-pro
execution:
  role: lower-cost
  primary_model_hint: kimi-k2.6
  high_risk_primary_hint: gpt-5.5
  backup_model_hints:
    - deepseek-v4-pro
    - qwen-3-coder
    - glm-5.1
audit:
  role: frontier
  primary_model_hint: claude-opus-4.7
  backup_model_hints:
    - gpt-5.5
    - gemini-3-pro
final_review:
  role: frontier
  primary_model_hint: gpt-5.5
  only_when: high_risk
  backup_model_hints:
    - claude-opus-4.7
    - gemini-3-pro
router:
  primary_model_hint: gpt-5.5-instant
  backup_model_hints:
    - gpt-5.4
    - gemini-3-pro
escalation_rules:
  - auth
  - payment
  - security
  - privacy
  - migration
  - production
  - data_loss
  - secrets
  - multi_service_architecture
  - repeated_failure
  - legal_compliance
execution_defaults:
  allow_lower_cost_when_risk: low
  force_frontier_when_risk: high
memory:
  save_after_plan: true
  save_after_audit: true
  sync_vector_after_save: true
  require_privacy_guard: true
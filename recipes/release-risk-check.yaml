version: 1.0.0
title: "Release Risk Check"
description: "Assess the change risk of an upcoming release: classify each PR/commit HIGH/MEDIUM/LOW and flag what to verify before shipping."
workflow: orchestrator_executor_auditor
skills:
  - bosskuai-rigorous-code-review
parameters:
  - key: range
    input_type: string
    requirement: required
    description: "Git range or version to assess, e.g. v1.12.0..HEAD or a tag."
  - key: focus
    input_type: select
    requirement: optional
    description: "Bias the risk lens."
    default: "balanced"
    options: ["balanced", "security", "data-integrity"]
prompt: |
  Assess release risk for: {{ range }} (focus: {{ focus }}).

  For each PR/commit in range, assign exactly one risk level and justify in one line:
  - HIGH: could bypass security, lose data, crash all users, or break core flows
    (auth, payments, migrations, permission/approval logic, tool execution).
  - MEDIUM: scenario-specific issues (provider-specific bug, UI regression,
    flagged new feature, config change).
  - LOW: isolated fix with tests, additive-only, or test/doc-only changes.

  Risk-up signals: edits to existing critical logic, no tests mentioned, large
  cross-subsystem diffs, reverts/re-applies, touches error/fallback paths.
  Risk-down signals: thorough tests, purely additive, test-only.

  Output a ranked table (highest risk first) and a short "verify before shipping"
  checklist for every HIGH and MEDIUM item.

version: 1.0.0
title: "Add Feature (lazy)"
description: "Plan and implement a feature the ponytail way — simplest thing that works, one runnable check, audited."
workflow: orchestrator_executor_auditor
skills:
  - bosskuai-engineering-delivery
parameters:
  - key: feature
    input_type: string
    requirement: required
    description: "What the feature should do, in one or two sentences."
  - key: area
    input_type: string
    requirement: optional
    description: "Where it lives (module/path), if known."
    default: "the most relevant existing module"
  - key: tests
    input_type: boolean
    requirement: optional
    description: "Leave the one runnable check behind?"
    default: "true"
prompt: |
  Implement this feature, ponytail discipline (lazy senior dev): {{ feature }}

  Area: {{ area }}. Climb the ladder before writing code — YAGNI, stdlib/native
  before deps, reuse existing patterns, fewest files, shortest diff. No
  unrequested abstractions. Mark any deliberate shortcut with a `ponytail:`
  comment naming its ceiling.

  Leave one runnable check ({{ tests }}): the smallest thing that fails if the
  logic breaks. Then summarize: what changed, what was deliberately skipped, and
  when to add it.

name: Desktop Release

# Ships a new desktop version + auto-update popup. Trigger by pushing a version
# tag, e.g.:
#   (bump desktop/package.json "version" to 3.0.1)
#   git commit -am "release: desktop 3.0.1"
#   git tag v3.0.1 && git push origin main --tags
#
# electron-builder publishes the installer + latest.yml to a GitHub Release for
# this repo; installed apps poll that feed and show the update popup.
# Also runnable manually from the Actions tab (workflow_dispatch).
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & publish Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build and publish installer
        working-directory: desktop
        env:
          # Lets electron-builder create the GitHub Release + upload assets.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release

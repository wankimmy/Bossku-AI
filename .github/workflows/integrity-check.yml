name: Integrity Check

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: pip install -e .

      - name: Validate repository
        run: python -m bossku validate --root .

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Doctor smoke (temp home)
        run: python -c "import tempfile, subprocess, sys; from pathlib import Path; h=Path(tempfile.mkdtemp()); subprocess.check_call([sys.executable,'-m','bossku','install','--root','.','--home',str(h),'--profile','core']); subprocess.check_call([sys.executable,'-m','bossku','doctor','--root','.','--home',str(h)])"
